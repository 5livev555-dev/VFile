[package]
name = "vfile"
version = "1.2.0"
edition = "2024"
description = "A modern cross-platform file manager"

[dependencies]
eframe = "0.37"
opener = "0.8"
dirs = "6"
egui_extras = { version = "0.37", features = ["svg"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
